<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>City Metro | BrickPass</title>

<!-- Firebase -->


<!-- QR -->
<script src="https://cdn.jsdelivr.net/npm/qrious/dist/qrious.min.js"></script>
</head>

<body>
  <script src="https://archives.citymetro.xyz/banner.js" data-name="BrickPass" data-version="v1.5" data-years="2025" data-live="https://mybrickpass.citymetro.xyz"></script>
<h1>City Metro</h1>
<h3>Create BrickPass</h3>

<form id="form">
  Name: <input id="name" required><br><br>
  Singles: <input id="singles" type="number" value="1" min="0"><br>
  Day Passes: <input id="day" type="number" value="0" min="0"><br>
  Week Passes: <input id="week" type="number" value="0" min="0"><br><br>
  <button>Create Ticket</button>
</form>

<div id="result" hidden>
  <h2>BrickPass Created ✅</h2>
  <canvas id="qr"></canvas>
  <p>Ticket ID: <span id="ticketId"></span></p>
</div>

<script>
/* 🔥 FIREBASE CONFIG — CHANGE THIS ONLY */
const firebaseConfig = {
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

/* CREATE TICKET */
document.getElementById("form").onsubmit = async e => {
  e.preventDefault();

  const id = "CM-" + Math.floor(Math.random() * 1000000);

  await db.collection("tickets").doc(id).set({
    name: name.value,
    singles: +singles.value,
    dayPasses: +day.value,
    weekPasses: +week.value,
    activePass: null,
    activatedAt: null
  });

  new QRious({
    element: document.getElementById("qr"),
    value: id,
    size: 220
  });

  ticketId.textContent = id;
  form.hidden = true;
  result.hidden = false;
};
</script>
</body>
</html>
