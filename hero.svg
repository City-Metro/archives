<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="City Metro transit map over a city skyline" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#0b2559"/>
      <stop offset="0.6" stop-color="#134590"/>
      <stop offset="1" stop-color="#1d63c4"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.35" r="0.6">
      <stop offset="0" stop-color="#7aa7ee" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7aa7ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#fff" stroke-opacity="0.05" stroke-width="2"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- archive clock motif -->
  <g fill="none" stroke="#fff" stroke-opacity="0.12" stroke-width="3">
    <circle cx="1230" cy="300" r="250"/>
    <circle cx="1230" cy="300" r="205" stroke-dasharray="4 18" stroke-linecap="round"/>
    <path d="M1230 300V150M1230 300l100 60" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- transit lines -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="16">
    <path d="M300 760V640L520 420H900L1100 220H1520" stroke="#7aa7ee" stroke-opacity="0.85"/>
    <path d="M560 800L760 600H1180L1380 400V160" stroke="#ffd166" stroke-opacity="0.8"/>
    <path d="M820 800V560L1000 380H1320L1500 560V760" stroke="#ef476f" stroke-opacity="0.75"/>
    <path d="M980 800L1100 680H1440" stroke="#06d6a0" stroke-opacity="0.75"/>
    <path d="M380 430H700L860 270H1060" stroke="#ffffff" stroke-opacity="0.35"/>
  </g>

  <!-- stations -->
  <g fill="#fff" stroke="#0b2559" stroke-width="6">
    <circle cx="520" cy="420" r="15"/><circle cx="900" cy="420" r="15"/>
    <circle cx="1100" cy="220" r="15"/><circle cx="1520" cy="220" r="15"/>
    <circle cx="760" cy="600" r="15"/><circle cx="1180" cy="600" r="15"/>
    <circle cx="1380" cy="400" r="15"/><circle cx="1000" cy="380" r="15"/>
    <circle cx="1320" cy="380" r="15"/><circle cx="1500" cy="560" r="15"/>
    <circle cx="1100" cy="680" r="15"/><circle cx="700" cy="430" r="15"/>
  </g>

  <!-- skyline -->
  <g fill="#081c43">
    <rect x="0" y="730" width="1600" height="170"/>
    <rect x="40" y="650" width="90" height="100"/><rect x="150" y="600" width="70" height="150"/>
    <rect x="240" y="680" width="110" height="70"/><rect x="380" y="560" width="80" height="190"/>
    <rect x="480" y="640" width="100" height="110"/><rect x="610" y="610" width="70" height="140"/>
    <rect x="700" y="670" width="120" height="80"/><rect x="850" y="590" width="80" height="160"/>
    <rect x="960" y="650" width="100" height="100"/><rect x="1090" y="570" width="70" height="180"/>
    <rect x="1180" y="660" width="120" height="90"/><rect x="1330" y="610" width="80" height="140"/>
    <rect x="1430" y="670" width="130" height="80"/>
  </g>
  <g fill="#ffd166" fill-opacity="0.55">
    <rect x="165" y="625" width="10" height="14"/><rect x="190" y="660" width="10" height="14"/>
    <rect x="398" y="590" width="10" height="14"/><rect x="425" y="640" width="10" height="14"/>
    <rect x="627" y="640" width="10" height="14"/><rect x="868" y="620" width="10" height="14"/>
    <rect x="1106" y="600" width="10" height="14"/><rect x="1348" y="640" width="10" height="14"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
